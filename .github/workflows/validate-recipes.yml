name: Validate Recipes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run recipe validator
        run: python scripts/validate-recipes.py